<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin · LEADATHON 2026</title>
<meta name="robots" content="noindex,nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --navy:#030164;--navy-2:#0a0a7a;--gold:#FFD758;--gold-soft:#FCE59A;
    --bg:#f6f1e8;--card:#ffffff;--ink:#0c0d2b;--muted:#5b5f7d;
    --line:rgba(3,1,100,.12);--glass:rgba(255,255,255,.66);
    --green:#12905a;--green-bg:#e3f5ec;--blue:#1f5fd0;--blue-bg:#e6eefb;--grey:#7b7f97;--grey-bg:#eeeef4;
    --radius:18px;--shadow:0 10px 40px -14px rgba(3,1,100,.2);
  }
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,-apple-system,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:'Fraunces',Georgia,serif;color:var(--navy);font-weight:600;line-height:1.1}
  svg{display:block}
  .icon{width:20px;height:20px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .wrap{max-width:1080px;margin:0 auto;padding:0 20px}
  button{font-family:inherit;cursor:pointer}
  .blob{position:fixed;border-radius:50%;filter:blur(80px);z-index:0;pointer-events:none;opacity:.3}
  .blob.g{width:460px;height:460px;top:-180px;right:-140px;background:radial-gradient(circle,var(--gold),transparent 70%)}

  /* NAV */
  nav{position:sticky;top:0;z-index:40;background:rgba(246,241,232,.8);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .nav-in{display:flex;align-items:center;justify-content:space-between;height:62px}
  .logo{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--navy)}
  .logo .mark{width:32px;height:32px;border-radius:9px;background:var(--navy);display:grid;place-items:center}
  .logo .mark .icon{color:var(--gold);width:18px;height:18px;stroke-width:2.2}
  .logo b{font-weight:700}.logo .tag{font-size:.7rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);background:var(--gold-soft);padding:3px 9px;border-radius:999px;margin-left:4px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--navy);color:#fff;font-weight:600;padding:10px 18px;border-radius:999px;border:none;font-size:.9rem;transition:transform .15s,box-shadow .15s;box-shadow:0 8px 22px -10px rgba(3,1,100,.6)}
  .btn:hover{transform:translateY(-1px)}
  .btn.sm{padding:7px 13px;font-size:.82rem}
  .btn.ghost{background:transparent;color:var(--navy);border:1px solid var(--line);box-shadow:none}
  .btn.green{background:var(--green);box-shadow:none}.btn.blue{background:var(--blue);box-shadow:none}
  .btn.gold{background:var(--gold);color:var(--navy);box-shadow:none}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn .icon{width:15px;height:15px}

  /* LOGIN */
  #login{min-height:calc(100vh - 62px);display:grid;place-items:center;padding:24px;position:relative;z-index:2}
  .login-card{max-width:400px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:34px;box-shadow:var(--shadow);text-align:center}
  .login-card .mark{width:52px;height:52px;border-radius:14px;background:var(--navy);display:grid;place-items:center;margin:0 auto 16px}
  .login-card .mark .icon{color:var(--gold);width:26px;height:26px}
  .login-card h1{font-size:1.5rem;margin-bottom:6px}
  .login-card p{color:var(--muted);font-size:.9rem;margin-bottom:20px}
  .login-card input{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;font-size:.95rem;font-family:inherit;text-align:center;letter-spacing:.05em}
  .login-card input:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 4px rgba(3,1,100,.1)}
  .login-card .btn{width:100%;margin-top:14px;padding:13px}
  .login-err{color:#d83a52;font-size:.84rem;margin-top:12px;min-height:1em}

  /* DASHBOARD */
  #dash{display:none;position:relative;z-index:2;padding:26px 0 70px}
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
  .head h1{font-size:1.9rem}
  .head p{color:var(--muted);font-size:.92rem}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
  @media(max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}}
  .stat{background:var(--glass);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow)}
  .stat b{display:block;font-family:'Fraunces',serif;font-size:2rem;color:var(--navy);font-weight:600}
  .stat span{color:var(--muted);font-size:.82rem;display:flex;align-items:center;gap:7px}
  .stat span .dot{width:8px;height:8px;border-radius:50%}
  .toolbar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px;align-items:center}
  .search{flex:1;min-width:220px;position:relative;display:flex;align-items:center}
  .search .icon{position:absolute;left:13px;color:var(--muted);width:17px;height:17px}
  .search input{width:100%;background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 13px 11px 38px;font-size:.92rem;font-family:inherit}
  .search input:focus{outline:none;border-color:var(--navy)}
  .scan{display:flex;gap:8px;align-items:center;background:#fff;border:1px dashed var(--navy);border-radius:11px;padding:5px 5px 5px 13px}
  .scan .icon{color:var(--navy);width:17px;height:17px}
  .scan input{border:none;background:transparent;font-size:.9rem;font-family:inherit;width:180px}
  .scan input:focus{outline:none}

  .team{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px;overflow:hidden;box-shadow:0 6px 24px -16px rgba(3,1,100,.3)}
  .team-h{display:flex;align-items:center;gap:14px;padding:18px 22px;cursor:pointer;flex-wrap:wrap}
  .team-h .tn{font-family:'Fraunces',serif;font-size:1.2rem;color:var(--navy);font-weight:600}
  .team-h .meta{color:var(--muted);font-size:.84rem}
  .team-h .pill{font-size:.72rem;font-weight:600;color:var(--navy);background:var(--gold-soft);padding:4px 10px;border-radius:999px}
  .team-h .spacer{flex:1}
  .team-h .cnt{display:flex;gap:6px;align-items:center;font-size:.8rem;color:var(--muted)}
  .team-h .chev{color:var(--muted);transition:transform .2s}
  .team.open .team-h .chev{transform:rotate(180deg)}
  .team-body{display:none;border-top:1px solid var(--line);padding:8px 22px 18px}
  .team.open .team-body{display:block}
  .prob{padding:14px 0 6px;border-bottom:1px dashed var(--line)}
  .prob .plabel{display:block;font-size:.64rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#a2a6bf;margin-bottom:3px}
  .prob b{color:var(--navy);font-size:.95rem}
  .prob .idea{margin-top:8px;color:var(--muted);font-size:.85rem}
  .subhead{font-size:.68rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:14px 0 2px}

  .p{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .p:last-child{border-bottom:none}
  .p .av{width:38px;height:38px;border-radius:10px;background:var(--navy);color:var(--gold);display:grid;place-items:center;font-weight:700;font-size:.85rem;flex-shrink:0}
  .p .info{min-width:180px;flex:1}
  .p .info .nm{font-weight:600;color:var(--navy);font-size:.98rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
  .p .fields{display:flex;flex-wrap:wrap;gap:7px 20px}
  .p .f{display:flex;flex-direction:column;line-height:1.25}
  .p .fl{font-size:.62rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#a2a6bf}
  .p .fv{font-size:.86rem;color:var(--ink)}
  .p .lead{font-size:.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#b98900}
  .status{font-size:.74rem;font-weight:700;padding:4px 11px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .status .dot{width:7px;height:7px;border-radius:50%}
  .status.registered{background:var(--grey-bg);color:var(--grey)}.status.registered .dot{background:var(--grey)}
  .status.checked_in{background:var(--green-bg);color:var(--green)}.status.checked_in .dot{background:var(--green)}
  .status.checked_out{background:var(--blue-bg);color:var(--blue)}.status.checked_out .dot{background:var(--blue)}
  .p .acts{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .iconbtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--muted)}
  .iconbtn:hover{color:var(--navy);border-color:var(--navy)}
  .iconbtn .icon{width:16px;height:16px}

  .empty{text-align:center;color:var(--muted);padding:60px 20px}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:12px 20px;border-radius:12px;font-size:.9rem;box-shadow:var(--shadow);opacity:0;transition:.25s;z-index:80}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.err{background:#c0263c}

  /* QR modal */
  .modal{position:fixed;inset:0;background:rgba(3,1,100,.35);backdrop-filter:blur(4px);display:none;place-items:center;z-index:90;padding:20px}
  .modal.show{display:grid}
  .modal .box{background:#fff;border-radius:20px;padding:28px;text-align:center;max-width:340px;width:100%}
  .modal .box h3{font-size:1.2rem;margin-bottom:4px}
  .modal .box p{color:var(--muted);font-size:.85rem;margin-bottom:16px}
  .modal .qr{display:inline-block;padding:14px;background:#fff;border:1px solid var(--line);border-radius:14px}
  .modal .box .btn{margin-top:16px}
</style>
</head>
<body>
<div class="blob g"></div>

<svg width="0" height="0" style="position:absolute"><defs>
  <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8Z"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></symbol>
  <symbol id="i-scan" viewBox="0 0 24 24"><path d="M4 7V5a1 1 0 0 1 1-1h2M17 4h2a1 1 0 0 1 1 1v2M20 17v2a1 1 0 0 1-1 1h-2M7 20H5a1 1 0 0 1-1-1v-2M4 12h16"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-out" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></symbol>
  <symbol id="i-mail" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 6 10-6"/></symbol>
  <symbol id="i-qr" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3M21 14v.01M14 21h.01M21 21v-3h-3"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5"/></symbol>
  <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M3 7v6h6M3 13a9 9 0 1 0 3-7.7L3 8"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/></symbol>
</defs></svg>

<nav>
  <div class="wrap nav-in">
    <div class="logo"><span class="mark"><svg class="icon"><use href="#i-bolt"/></svg></span><b>LEADATHON</b> <span class="tag">Admin</span></div>
    <button class="btn ghost sm" id="logoutBtn" style="display:none" onclick="logout()"><svg class="icon"><use href="#i-logout"/></svg> Log out</button>
  </div>
</nav>

<!-- LOGIN -->
<div id="login">
  <div class="login-card">
    <div class="mark"><svg class="icon"><use href="#i-bolt"/></svg></div>
    <h1>Back-office</h1>
    <p>Enter your admin access token to manage registrations and event check-in.</p>
    <input type="password" id="token" placeholder="Admin access token" autocomplete="off" />
    <button class="btn" onclick="login()">Enter dashboard <svg class="icon"><use href="#i-check"/></svg></button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- DASHBOARD -->
<main id="dash">
  <div class="wrap">
    <div class="head">
      <div><h1>Registrations & Check-in</h1><p id="updatedAt">—</p></div>
      <button class="btn ghost sm" onclick="load()"><svg class="icon"><use href="#i-refresh"/></svg> Refresh</button>
    </div>

    <div class="stats" id="stats"></div>

    <div class="toolbar">
      <div class="search"><svg class="icon"><use href="#i-search"/></svg><input id="q" placeholder="Search team, name, email, problem…" oninput="render()" /></div>
      <div class="scan"><svg class="icon"><use href="#i-scan"/></svg><input id="scan" placeholder="Scan / paste QR to check in" onkeydown="if(event.key==='Enter')scanCheckin()" /><button class="btn green sm" onclick="scanCheckin()">Check in</button></div>
    </div>

    <div id="list"></div>
  </div>
</main>

<div class="modal" id="qrModal" onclick="if(event.target===this)closeQr()">
  <div class="box">
    <h3 id="qrName">QR Pass</h3>
    <p id="qrTeam"></p>
    <div class="qr" id="qrBox"></div>
    <button class="btn ghost sm" onclick="closeQr()">Close</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const $ = s => document.querySelector(s);
  let TOKEN = localStorage.getItem('leadathon_admin') || '';
  let DATA = [];

  function toast(msg, err){ const t=$('#toast'); t.textContent=msg; t.className='toast show'+(err?' err':''); setTimeout(()=>t.className='toast',2600); }

  async function api(path, opts){
    opts = opts||{};
    opts.headers = Object.assign({'Content-Type':'application/json','Authorization':'Bearer '+TOKEN}, opts.headers||{});
    const res = await fetch(path, opts);
    if(res.status===401){ logout(); throw new Error('Session expired'); }
    return res.json();
  }

  async function login(){
    const token = $('#token').value.trim();
    $('#loginErr').textContent='';
    if(!token){ $('#loginErr').textContent='Enter your admin token.'; return; }
    try{
      const res = await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});
      const j = await res.json();
      if(!j.ok){ $('#loginErr').textContent = j.error||'Invalid token'; return; }
      TOKEN = token; localStorage.setItem('leadathon_admin', token);
      showDash();
    }catch(e){ $('#loginErr').textContent='Could not sign in.'; }
  }
  function logout(){ TOKEN=''; localStorage.removeItem('leadathon_admin'); $('#dash').style.display='none'; $('#login').style.display='grid'; $('#logoutBtn').style.display='none'; $('#token').value=''; }

  function showDash(){ $('#login').style.display='none'; $('#dash').style.display='block'; $('#logoutBtn').style.display='inline-flex'; load(); }

  async function load(){
    try{
      const j = await api('/api/admin/registrations');
      if(!j.ok) throw new Error(j.error);
      DATA = j.registrations||[];
      renderStats(j.stats);
      render();
      $('#updatedAt').textContent = 'Updated '+new Date().toLocaleTimeString();
    }catch(e){ toast(e.message||'Load failed', true); }
  }

  function renderStats(s){
    s = s||{teams:0,participants:0,checkedIn:0,checkedOut:0};
    $('#stats').innerHTML = `
      <div class="stat"><b>${s.teams}</b><span><span class="dot" style="background:var(--navy)"></span> Teams</span></div>
      <div class="stat"><b>${s.participants}</b><span><span class="dot" style="background:var(--navy)"></span> Participants</span></div>
      <div class="stat"><b>${s.checkedIn}</b><span><span class="dot" style="background:var(--green)"></span> Checked in</span></div>
      <div class="stat"><b>${s.checkedOut}</b><span><span class="dot" style="background:var(--blue)"></span> Checked out</span></div>`;
  }

  const esc = s => String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const statusLabel = s => ({registered:'Registered',checked_in:'Checked in',checked_out:'Checked out'}[s]||s);

  function render(){
    const q = $('#q').value.trim().toLowerCase();
    const teams = DATA.filter(r=>{
      if(!q) return true;
      const hay = [r.team_name, r.problem_statement, r.problem_category, ...(r.participants||[]).flatMap(p=>[p.name,p.email,p.phone])].join(' ').toLowerCase();
      return hay.includes(q);
    });
    if(!teams.length){ $('#list').innerHTML = '<div class="empty">No registrations found.</div>'; return; }
    $('#list').innerHTML = teams.map(r=>{
      const parts = (r.participants||[]).map(p=>{
        return `<div class="p">
          <div class="av">${p.idx}</div>
          <div class="info">
            <div class="nm">${esc(p.name)} ${p.idx===1?'<span class="lead">Lead</span>':''}</div>
            <div class="fields">
              <div class="f"><span class="fl">Phone</span><span class="fv">${esc(p.phone)}</span></div>
              <div class="f"><span class="fl">Email</span><span class="fv">${esc(p.email)}</span></div>
              <div class="f"><span class="fl">Profile</span><span class="fv">${esc(p.profile)}</span></div>
              ${p.institution?`<div class="f"><span class="fl">Institution</span><span class="fv">${esc(p.institution)}</span></div>`:''}
            </div>
          </div>
          <span class="status ${p.status}"><span class="dot"></span>${statusLabel(p.status)}</span>
          <div class="acts">
            ${p.status!=='checked_in' ? `<button class="btn green sm" onclick="act('${p.id}','in')"><svg class="icon"><use href="#i-check"/></svg> In</button>`:''}
            ${p.status==='checked_in' ? `<button class="btn blue sm" onclick="act('${p.id}','out')"><svg class="icon"><use href="#i-out"/></svg> Out</button>`:''}
            <button class="iconbtn" title="Show QR" onclick='showQr(${JSON.stringify({t:p.qr_token,n:p.name,team:r.team_name})})'><svg class="icon"><use href="#i-qr"/></svg></button>
            <button class="iconbtn" title="Resend QR email" onclick="resend('${p.id}',this)"><svg class="icon"><use href="#i-mail"/></svg></button>
            ${p.status!=='registered' ? `<button class="iconbtn" title="Reset" onclick="act('${p.id}','reset')"><svg class="icon"><use href="#i-undo"/></svg></button>`:''}
          </div>
        </div>`;
      }).join('');
      const date = new Date(r.created_at).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
      return `<div class="team" data-id="${r.id}">
        <div class="team-h" onclick="this.parentNode.classList.toggle('open')">
          <div><div class="tn">${esc(r.team_name)}</div><div class="meta">${esc(r.problem_category)} · ${date}</div></div>
          <span class="pill">${esc(r.project_stage)}</span>
          <div class="spacer"></div>
          <div class="cnt"><svg class="icon" style="width:16px;height:16px;color:var(--muted)"><use href="#i-users"/></svg> ${(r.participants||[]).length}</div>
          <svg class="icon chev"><use href="#i-chev"/></svg>
        </div>
        <div class="team-body">
          <div class="prob">
            <span class="plabel">Problem statement · ${esc(r.problem_category||'')}</span>
            <b>${esc(r.problem_code||'')} ${esc(r.problem_title||'')}</b>
            ${r.idea_summary?`<div class="idea"><span class="plabel">Idea summary</span>${esc(r.idea_summary)}</div>`:''}
          </div>
          <div class="subhead">Participants (${(r.participants||[]).length})</div>
          ${parts}
        </div>
      </div>`;
    }).join('');
  }

  async function act(id, action){
    try{
      const j = await api('/api/admin/checkin',{method:'POST',body:JSON.stringify({participantId:id, action})});
      if(!j.ok) throw new Error(j.error);
      updateLocal(j.participant);
      toast(action==='in'?'Checked in':action==='out'?'Checked out':'Reset');
    }catch(e){ toast(e.message||'Action failed', true); }
  }

  async function scanCheckin(){
    const val = $('#scan').value.trim();
    if(!val) return;
    try{
      const j = await api('/api/admin/checkin',{method:'POST',body:JSON.stringify({token:val, action:'in'})});
      if(!j.ok) throw new Error(j.error);
      updateLocal(j.participant);
      $('#scan').value='';
      const name = j.participant && j.participant.name;
      toast('Checked in'+(name?': '+name:''));
    }catch(e){ toast(e.message||'Not found', true); $('#scan').select(); }
  }

  async function resend(id, btn){
    if(btn){ btn.disabled=true; }
    try{
      const j = await api('/api/admin/resend',{method:'POST',body:JSON.stringify({participantId:id})});
      if(!j.ok) throw new Error(j.error);
      toast('QR email sent');
    }catch(e){ toast(e.message||'Email failed', true); }
    finally{ if(btn) btn.disabled=false; }
  }

  function updateLocal(part){
    if(!part) return load();
    for(const r of DATA){ const p=(r.participants||[]).find(x=>x.id===part.id); if(p){ Object.assign(p,part); break; } }
    // refresh stats
    const all = DATA.reduce((a,r)=>a.concat(r.participants||[]),[]);
    renderStats({teams:DATA.length, participants:all.length, checkedIn:all.filter(p=>p.status==='checked_in').length, checkedOut:all.filter(p=>p.status==='checked_out').length});
    render();
  }

  function showQr(o){
    $('#qrName').textContent = o.n;
    $('#qrTeam').textContent = o.team;
    const box = $('#qrBox'); box.innerHTML='';
    const url = location.origin + '/verify?t=' + o.t;
    new QRCode(box, { text:url, width:220, height:220, colorDark:'#030164', colorLight:'#ffffff', correctLevel: QRCode.CorrectLevel.M });
    $('#qrModal').classList.add('show');
  }
  function closeQr(){ $('#qrModal').classList.remove('show'); }

  // Auto-login if token stored; support ?scan= deep link
  if(TOKEN){ showDash(); }
  const sp = new URLSearchParams(location.search);
  if(sp.get('scan') && TOKEN){ window.addEventListener('load', ()=>{ $('#scan').value = sp.get('scan'); }); }
  $('#token').addEventListener('keydown', e=>{ if(e.key==='Enter') login(); });
</script>
</body>
</html>
