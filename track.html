<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Challenge Track · LEADATHON 2026</title>
<meta name="description" content="Explore the challenge track and its detailed problem statements for LEADATHON 2026." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --navy:#030164;--navy-2:#0a0a7a;--gold:#FFD758;--gold-soft:#FCE59A;
    --bg:#ffffff;--bg-tint:#f7f8fc;--ink:#0c0d2b;--muted:#5b5f7d;
    --line:rgba(3,1,100,.10);--glass:rgba(255,255,255,.55);--glass-strong:rgba(255,255,255,.72);
    --radius:20px;--maxw:1140px;--shadow:0 10px 40px -12px rgba(3,1,100,.18);--shadow-lg:0 24px 60px -20px rgba(3,1,100,.30);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,-apple-system,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  h1,h2,h3,h4{font-family:'Fraunces',Georgia,serif;line-height:1.1;letter-spacing:-0.01em;color:var(--navy);font-weight:600}
  a{color:inherit;text-decoration:none}
  svg{display:block}
  .icon{width:22px;height:22px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 22px}
  .blob{position:absolute;border-radius:50%;filter:blur(80px);z-index:0;pointer-events:none;opacity:.38}
  .blob.gold{background:radial-gradient(circle,var(--gold),transparent 70%)}
  .blob.soft{background:radial-gradient(circle,var(--gold-soft),transparent 70%)}
  #progress{position:fixed;top:0;left:0;height:3px;width:0;background:var(--gold);z-index:100;transition:width .12s linear}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;background:var(--navy);color:#fff;font-weight:600;padding:12px 22px;border-radius:999px;border:none;cursor:pointer;font-size:.95rem;font-family:inherit;transition:transform .16s,box-shadow .16s;box-shadow:0 10px 26px -10px rgba(3,1,100,.6);white-space:nowrap}
  .btn:hover{transform:translateY(-2px);box-shadow:0 16px 32px -10px rgba(3,1,100,.7)}
  .btn .icon{width:18px;height:18px}
  .btn.gold{background:var(--gold);color:var(--navy);box-shadow:0 10px 26px -10px rgba(255,215,88,.9)}
  .btn.ghost{background:var(--glass);color:var(--navy);border:1px solid var(--line);backdrop-filter:blur(10px);box-shadow:none}
  .btn.ghost:hover{border-color:var(--navy)}

  nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.72);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);border-bottom:1px solid var(--line)}
  .nav-in{display:flex;align-items:center;justify-content:space-between;height:66px;gap:16px}
  .logo{display:flex;align-items:center;gap:11px;font-family:'Inter';font-weight:700;font-size:1.06rem;color:var(--navy)}
  .logo .mark{width:34px;height:34px;border-radius:10px;background:var(--navy);display:grid;place-items:center}
  .logo .mark .icon{color:var(--gold);width:19px;height:19px;stroke-width:2.2}
  .crumb{color:var(--muted);font-size:.9rem;display:flex;align-items:center;gap:8px}
  .crumb a:hover{color:var(--navy)}
  .crumb .icon{width:15px;height:15px}
  @media(max-width:640px){.crumb .txt{display:none}}

  /* HERO */
  .thero{position:relative;overflow:hidden;padding:56px 0 30px}
  .thero .blob.a{width:480px;height:480px;top:-180px;right:-140px}
  .thero .blob.b{width:420px;height:420px;bottom:-220px;left:-160px}
  .thero-in{position:relative;z-index:2;max-width:820px}
  .back-link{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-weight:500;font-size:.9rem;margin-bottom:22px}
  .back-link:hover{color:var(--navy)}
  .back-link .icon{width:16px;height:16px}
  .thead{display:flex;align-items:center;gap:18px;margin-bottom:20px}
  .thead .tile{width:64px;height:64px;border-radius:16px;background:var(--navy);display:grid;place-items:center;flex-shrink:0;box-shadow:var(--shadow)}
  .thead .tile .icon{color:var(--gold);width:32px;height:32px}
  .thead .code{font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--navy);background:var(--gold-soft);padding:5px 12px;border-radius:999px;display:inline-block;margin-bottom:8px}
  .thead h1{font-size:clamp(2rem,4.4vw,3rem);font-weight:500}
  .tlede{color:var(--muted);font-size:1.12rem;max-width:680px}
  .tmeta{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
  .tmeta .chip{display:inline-flex;align-items:center;gap:8px;background:var(--glass-strong);border:1px solid var(--line);border-radius:999px;padding:9px 15px;font-size:.86rem;font-weight:500;color:var(--navy);backdrop-filter:blur(10px);box-shadow:var(--shadow)}
  .tmeta .chip .icon{width:16px;height:16px;color:var(--navy)}

  /* JUMP LIST */
  .jump{position:relative;z-index:2;display:flex;flex-wrap:wrap;gap:10px;padding:8px 0 0}
  .jump a{display:inline-flex;align-items:center;gap:8px;font-size:.84rem;font-weight:600;color:var(--navy);background:var(--glass-strong);border:1px solid var(--line);border-radius:999px;padding:8px 14px;backdrop-filter:blur(8px);transition:.15s}
  .jump a:hover{border-color:var(--gold);transform:translateY(-2px)}
  .jump a b{color:var(--gold);font-family:'Inter';font-weight:700}
  .jump a b{color:#b98900}

  /* PROBLEM CARDS */
  .problems{position:relative;z-index:2;padding:40px 0 20px;display:grid;gap:22px}
  .pcard{scroll-margin-top:90px;border-radius:var(--radius);padding:30px;background:var(--glass);backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%);border:1px solid rgba(255,255,255,.8);box-shadow:var(--shadow)}
  @media(max-width:560px){.pcard{padding:22px}}
  .pcard .ph{display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap}
  .pcard .ph .num{font-size:.74rem;font-weight:700;letter-spacing:.1em;color:#fff;background:var(--navy);padding:5px 11px;border-radius:999px}
  .pcard .ph h3{font-size:1.4rem;font-weight:600;flex:1;min-width:200px}
  .pcard .prow{display:grid;grid-template-columns:150px 1fr;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
  @media(max-width:560px){.pcard .prow{grid-template-columns:1fr;gap:5px}}
  .pcard .prow .lbl{display:flex;align-items:flex-start;gap:9px;font-size:.76rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--navy);padding-top:2px}
  .pcard .prow .lbl .ic{width:26px;height:26px;border-radius:8px;background:var(--gold-soft);display:grid;place-items:center;flex-shrink:0}
  .pcard .prow .lbl .ic .icon{width:15px;height:15px;color:var(--navy)}
  .pcard .prow .val{color:var(--ink);font-size:.98rem}
  .pcard .prow.success .val{font-weight:600;color:var(--navy)}
  .pcard .pcta{margin-top:18px}
  .pcard .pcta .btn{padding:10px 18px;font-size:.9rem}

  /* SECTION TITLES */
  .sec{position:relative;padding:56px 0;overflow:hidden}
  .sec.tint{background:var(--bg-tint);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;color:var(--navy);font-weight:700;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;background:var(--gold-soft);padding:6px 14px;border-radius:999px}
  .eyebrow .icon{width:15px;height:15px}
  .sec h2{font-size:clamp(1.7rem,3.4vw,2.3rem);font-weight:500;margin-top:14px}
  .sec .lead{color:var(--muted);margin-top:12px;max-width:620px}

  /* ALL TRACKS GRID */
  .tracks{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:34px;position:relative;z-index:2}
  @media(max-width:900px){.tracks{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.tracks{grid-template-columns:1fr}}
  .track{border-radius:16px;padding:18px;display:flex;gap:14px;align-items:flex-start;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.8);box-shadow:var(--shadow);transition:transform .18s,box-shadow .18s}
  .track:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
  .track.current{border-color:var(--gold);background:var(--glass-strong)}
  .track .te{width:44px;height:44px;border-radius:11px;background:var(--navy);display:grid;place-items:center;flex-shrink:0}
  .track .te .icon{color:var(--gold);width:22px;height:22px}
  .track b{display:block;font-family:'Inter';font-size:.97rem;font-weight:600;color:var(--navy)}
  .track small{color:var(--muted);font-size:.82rem}
  .track .badge{font-size:.68rem;color:#b98900;font-weight:700;letter-spacing:.08em;text-transform:uppercase}

  /* CTA */
  .cta{position:relative;overflow:hidden;background:var(--navy);border-radius:26px;padding:56px 40px;text-align:center;margin:56px 22px}
  .cta .blob{opacity:.4;width:420px;height:420px;top:-180px;left:50%;transform:translateX(-50%);background:radial-gradient(circle,rgba(255,215,88,.6),transparent 70%)}
  .cta h2{color:#fff;font-size:clamp(1.7rem,3.6vw,2.5rem);font-weight:500;position:relative;z-index:2}
  .cta p{color:rgba(255,255,255,.8);margin:14px auto 26px;max-width:520px;position:relative;z-index:2}
  .cta .btn{position:relative;z-index:2}

  footer{border-top:1px solid var(--line);padding:36px 0;color:var(--muted);font-size:.88rem;background:var(--bg-tint)}
  .foot-in{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:center}
  .tagline{font-family:'Inter';font-weight:700;color:var(--navy);display:flex;align-items:center;gap:10px}
  .tagline .icon{width:18px;height:18px;color:var(--navy)}
  .notfound{padding:120px 22px;text-align:center}
  .notfound h1{font-size:2rem}
  .notfound p{color:var(--muted);margin:12px 0 24px}
</style>
</head>
<body>
<div id="progress"></div>

<!-- ICON SPRITE -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8Z"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="i-arrow-l" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 11 9-8 9 8M5 10v10h14V10"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16h.01"/></symbol>
  <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></symbol>
  <symbol id="i-cpu" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v2M15 2v2M9 20v2M15 20v2M2 9h2M2 15h2M20 9h2M20 15h2"/></symbol>
  <symbol id="i-flag" viewBox="0 0 24 24"><path d="M4 22V4M4 4c3-2 7 2 10 0v9c-3 2-7-2-10 0"/></symbol>
  <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 2 9 5-9 5-9-5 9-5Z"/><path d="m3 12 9 5 9-5M3 17l9 5 9-5"/></symbol>
  <symbol id="i-clip" viewBox="0 0 24 24"><rect x="6" y="4" width="12" height="18" rx="2"/><path d="M9 4V3a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1M9 10h6M9 14h6M9 18h4"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13A4 4 0 0 1 16 11"/></symbol>
  <symbol id="i-rocket" viewBox="0 0 24 24"><path d="M4.5 16.5c-1.5 1.3-2 5-2 5s3.7-.5 5-2c.7-.8.7-2 0-2.8a2 2 0 0 0-3 0ZM12 15l-3-3a22 22 0 0 1 8-10c1.9 0 5 3.1 5 5a22 22 0 0 1-10 8ZM9 12H4s.5-2.8 2-4 4-1 4-1M12 15v5s2.8-.5 4-2 1-4 1-4"/></symbol>
  <symbol id="i-crown" viewBox="0 0 24 24"><path d="m2 18 2-11 5 5 3-6 3 6 5-5 2 11H2Z"/><path d="M4 21h16"/></symbol>
  <symbol id="i-landmark" viewBox="0 0 24 24"><path d="M3 22h18M4 10h16M12 2 3 7h18l-9-5ZM6 10v8M10 10v8M14 10v8M18 10v8"/></symbol>
  <symbol id="i-scroll" viewBox="0 0 24 24"><path d="M8 3H6a2 2 0 0 0-2 2v13a3 3 0 0 0 3 3h11a2 2 0 0 0 2-2v-1H9M8 3h9a2 2 0 0 1 2 2v11H8V3Z"/></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20Z"/></symbol>
  <symbol id="i-sprout" viewBox="0 0 24 24"><path d="M7 20h10M12 20v-8M12 12c0-3-2-5-5-5 0 3 2 5 5 5ZM12 12c0-4 3-6 7-6 0 4-3 6-7 6Z"/></symbol>
  <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M11 20A7 7 0 0 1 4 13c0-6 5-9 16-9 0 8-3 13-9 13ZM4 20c3-4 6-7 12-9"/></symbol>
  <symbol id="i-car" viewBox="0 0 24 24"><path d="M5 13 6.5 8h11L19 13M5 13h14v5H5v-5ZM5 18v2M19 18v2"/><circle cx="8" cy="15" r="1"/><circle cx="16" cy="15" r="1"/></symbol>
  <symbol id="i-pulse" viewBox="0 0 24 24"><path d="M22 12h-4l-3 8-6-16-3 8H2"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 2 4 5v6c0 5 3.5 8.5 8 11 4.5-2.5 8-6 8-11V5l-8-3Z"/><path d="m9 12 2 2 4-4"/></symbol>
  <symbol id="i-factory" viewBox="0 0 24 24"><path d="M2 20h20V9l-6 4V9l-6 4V4H2v16ZM6 16h2M11 16h2M16 16h2"/></symbol>
  <symbol id="i-puzzle" viewBox="0 0 24 24"><path d="M4 7h3a1.5 1.5 0 1 0 3 0h3v3a1.5 1.5 0 1 1 0 3v3h-3a1.5 1.5 0 1 0-3 0H4v-3a1.5 1.5 0 1 1 0-3V7Z"/></symbol>
</defs></svg>

<nav>
  <div class="wrap nav-in">
    <a class="logo" href="/"><span class="mark"><svg class="icon"><use href="#i-bolt"/></svg></span>LEADATHON</a>
    <div class="crumb"><a href="/"><svg class="icon"><use href="#i-home"/></svg></a> <span>/</span> <a href="/#tracks">Tracks</a> <span>/</span> <span class="txt" id="crumbName" style="color:var(--navy);font-weight:600">Track</span></div>
    <a href="/register" class="btn">Register <svg class="icon"><use href="#i-arrow"/></svg></a>
  </div>
</nav>

<main id="app"></main>

<footer>
  <div class="wrap foot-in">
    <div>
      <div class="tagline"><svg class="icon"><use href="#i-bolt"/></svg> LEADATHON 2026 — DON'T JUST TELL US. BUILD IT.</div>
      <div style="margin-top:8px">An initiative of the We The Leaders Foundation · Manapparai, Tamil Nadu</div>
    </div>
    <a href="/#tracks" class="btn ghost">All Tracks <svg class="icon"><use href="#i-arrow"/></svg></a>
  </div>
</footer>

<script src="/tracks-data.js"></script>
<script>
  const TRACKS = window.LEADATHON_TRACKS || [];
  const params = new URLSearchParams(location.search);
  const slug = params.get('slug');
  const track = TRACKS.find(t => t.slug === slug);
  const app = document.getElementById('app');
  const esc = s => String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  function icon(id){ return `<svg class="icon"><use href="#${id}"/></svg>`; }

  function allTracksGrid(){
    return TRACKS.map(t=>`
      <a class="track${t.slug===slug?' current':''}" href="/track?slug=${t.slug}">
        <span class="te">${icon(t.icon)}</span>
        <div><b>${esc(t.name)}</b>${t.slug===slug?'<span class="badge">You are here</span>':`<small>${t.problems.length} problem statements</small>`}</div>
      </a>`).join('');
  }

  if(!track){
    document.title = 'Track not found · LEADATHON 2026';
    app.innerHTML = `<div class="notfound">
      <h1>Track not found</h1>
      <p>Pick one of the 13 challenge tracks below.</p>
      <a class="btn" href="/#tracks">Browse all tracks ${icon('i-arrow')}</a>
      <div class="wrap"><div class="tracks" style="margin-top:40px">${allTracksGrid()}</div></div>
    </div>`;
  } else {
    document.title = `${track.name} · LEADATHON 2026`;
    document.querySelector('meta[name=description]').setAttribute('content', `${track.name} — ${track.problems.length} detailed problem statements for LEADATHON 2026. ${track.tagline}`);
    document.getElementById('crumbName').textContent = track.name;

    const jump = track.problems.map((p,i)=>`<a href="#${p.code}"><b>${esc(p.code)}</b> ${esc(p.title)}</a>`).join('');

    const cards = track.problems.map((p,i)=>`
      <article class="pcard" id="${p.code}">
        <div class="ph"><span class="num">${esc(p.code)}</span><h3>${esc(p.title)}</h3></div>
        <div class="prow"><div class="lbl"><span class="ic">${icon('i-alert')}</span> Problem</div><div class="val">${esc(p.problem)}</div></div>
        <div class="prow"><div class="lbl"><span class="ic">${icon('i-target')}</span> Challenge</div><div class="val">${esc(p.challenge)}</div></div>
        <div class="prow"><div class="lbl"><span class="ic">${icon('i-cpu')}</span> Expected Solution</div><div class="val">${esc(p.expected)}</div></div>
        <div class="prow success"><div class="lbl"><span class="ic">${icon('i-flag')}</span> Success Criteria</div><div class="val">${esc(p.success)}</div></div>
        <div class="pcta"><a class="btn gold" href="/register">Build this — Register ${icon('i-arrow')}</a></div>
      </article>`).join('');

    app.innerHTML = `
      <header class="thero">
        <div class="blob gold a"></div><div class="blob soft b"></div>
        <div class="wrap thero-in">
          <a class="back-link" href="/#tracks">${icon('i-arrow-l')} All challenge tracks</a>
          <div class="thead">
            <span class="tile">${icon(track.icon)}</span>
            <div>
              <span class="code">${esc(track.code)}</span>
              <h1>${esc(track.name)}</h1>
            </div>
          </div>
          <p class="tlede">${esc(track.tagline)}</p>
          <div class="tmeta">
            <span class="chip">${icon('i-clip')} ${track.problems.length} problem statements</span>
            <span class="chip">${icon('i-layers')} Part of 13 tracks</span>
            <span class="chip">${icon('i-users')} Teams of 1–5</span>
          </div>
          <div class="jump">${jump}</div>
        </div>
      </header>

      <div class="wrap problems">${cards}</div>

      <div class="cta">
        <div class="blob"></div>
        <h2>Ready to take on ${esc(track.name)}?</h2>
        <p>Pick a problem statement, form your team of 1–5, and start building.</p>
        <a class="btn gold" href="/register">Register your team ${icon('i-arrow')}</a>
      </div>

      <section class="sec tint">
        <div class="wrap">
          <p class="eyebrow">${icon('i-layers')} Explore all 13 tracks</p>
          <h2>Every challenge track</h2>
          <p class="lead">Over 60 problem statements across critical sectors and unconventional frontiers. Jump into any track.</p>
          <div class="tracks">${allTracksGrid()}</div>
        </div>
      </section>`;
  }

  // Scroll progress
  addEventListener('scroll', ()=>{
    const h=document.documentElement;
    const max=h.scrollHeight-h.clientHeight;
    document.getElementById('progress').style.width = (max>0 ? (h.scrollTop/max*100):0)+'%';
  }, {passive:true});
</script>
</body>
</html>
